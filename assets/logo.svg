<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bg" x1="26" y1="26" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131B33"/>
      <stop offset="100%" stop-color="#223463"/>
    </linearGradient>
    <linearGradient id="accent" x1="68" y1="54" x2="188" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CC4FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="flagClip">
      <rect x="64" y="182" width="128" height="24" rx="12"/>
    </clipPath>
  </defs>

  <!-- 10% safe outer margin: badge sits inside 26..230 -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="url(#bg)"/>
  <rect x="27.5" y="27.5" width="201" height="201" rx="42.5" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Minimal Antigravity chevron crest -->
  <path d="M128 50L164 110H143L128 84L113 110H92L128 50Z" fill="url(#accent)"/>
  <circle cx="128" cy="108" r="7" fill="#7CC4FF"/>

  <!-- High-contrast RU badge text -->
  <text x="128" y="164" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="800" font-size="50" letter-spacing="3" fill="#FFFFFF">RU</text>

  <!-- Crisp tricolor pill accent -->
  <g clip-path="url(#flagClip)">
    <rect x="64" y="182" width="128" height="8" fill="#FFFFFF"/>
    <rect x="64" y="190" width="128" height="8" fill="#1D6FE8"/>
    <rect x="64" y="198" width="128" height="8" fill="#E53935"/>
  </g>
  <rect x="64.5" y="182.5" width="127" height="23" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
</svg>
